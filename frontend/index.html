<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CyberLab - learn cybersecurity by doing: guided challenges, a simulated terminal, hints and progress tracking." />
    <title>CyberLab - Learn Cybersecurity by Doing</title>
    <script>
      // Apply the saved colour theme before the page is drawn, so dark-mode users never see a white flash.
      // Same rules as src/utils/theme.ts: 'dark', or 'system'/unset while the operating system prefers dark.
      try {
        var theme = localStorage.getItem('cyberlab-theme')
        if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
